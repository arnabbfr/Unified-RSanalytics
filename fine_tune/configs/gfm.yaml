# GFM Composition Pretraining (SAR + Optical Multi-Sensor Fusion) Configuration
model:
  name: gfm
  pretrained: 05kashyap/GFM_Composition_Pretraining
  feature_dim: 256
  decoder: segmentation_decoder
  unfreeze_last_n_blocks: 2

data:
  dataset: sen1floods11_compositional
  modality: sar_optical  # SAR (2-ch) + Optical (4-ch or 10-ch)
  channels_sar:
    - VV
    - VH
  channels_optical:
    - B02
    - B03
    - B04
    - B08
  in_channels: 6  # 2 SAR + 4 Optical
  image_size: 224
  num_classes: 1
  ignore_index: -1
  root: "${DATASET_ROOT:-fine_tune/data/sample_compositional}"
  normalize:
    type: sar_optical_hybrid
  augmentations:
    random_flip: true
    random_rotate: true
    random_crop: false

training:
  strategy: frozen
  epochs: 10
  batch_size: 1
  num_workers: 0
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  weight_decay: 0.01
  gradient_accumulation_steps: 4
  mixed_precision: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  early_stopping_patience: 5
  seed: 42

loss:
  type: combined
  bce_weight: 0.5
  dice_weight: 0.5

checkpoint:
  dir: "fine_tune/checkpoints/gfm"
  save_best: true
  monitor: val_iou
  mode: max

results:
  dir: "fine_tune/results/gfm"

logging:
  tensorboard: true
  csv: true
  log_interval: 10
