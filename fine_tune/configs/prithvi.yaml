# Prithvi-EO-2.0-600M-TL Multispectral Optical Segmentation Configuration
# NOTE: Prithvi-EO-2.0 expects 6-band optical inputs (B02, B03, B04, B8A, B11, B12).
# It does NOT accept pure 2-channel Sentinel-1 SAR inputs directly without explicit multi-sensor data.
model:
  name: prithvi
  pretrained: ibm-nasa-geospatial/Prithvi-EO-2.0-600M-TL
  feature_dim: 256
  decoder: segmentation_decoder
  unfreeze_last_n_blocks: 2

data:
  dataset: sen1floods11_optical
  modality: multispectral  # Expected modality
  channels:
    - B02  # Blue
    - B03  # Green
    - B04  # Red
    - B8A  # Narrow NIR
    - B11  # SWIR-1
    - B12  # SWIR-2
  in_channels: 6
  image_size: 224
  num_classes: 1
  ignore_index: -1
  root: "${DATASET_ROOT:-fine_tune/data/sample_multispectral}"
  normalize:
    type: optical_reflectance_norm
    mean: [0.13, 0.14, 0.15, 0.32, 0.22, 0.15]
    std: [0.08, 0.08, 0.09, 0.12, 0.11, 0.09]
  augmentations:
    random_flip: true
    random_rotate: true
    random_crop: false

training:
  strategy: frozen  # Strongly recommended: model is 600M parameters!
  epochs: 10
  batch_size: 1
  num_workers: 0
  learning_rate: 0.0001
  backbone_learning_rate: 0.000005
  weight_decay: 0.01
  gradient_accumulation_steps: 8  # Increased accumulation for 600M parameter model
  mixed_precision: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  early_stopping_patience: 5
  seed: 42

loss:
  type: combined
  bce_weight: 0.5
  dice_weight: 0.5

checkpoint:
  dir: "fine_tune/checkpoints/prithvi"
  save_best: true
  monitor: val_iou
  mode: max

results:
  dir: "fine_tune/results/prithvi"

logging:
  tensorboard: true
  csv: true
  log_interval: 10
