name: Continuous Integration

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop_App/Upgrahan2/**'
      - 'Desktop_App/UpgrahanRust/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Desktop_App/Upgrahan2/**'
      - 'Desktop_App/UpgrahanRust/**'
      - '.github/workflows/ci.yml'

jobs:
  test-and-build:
    name: Test & Build Desktop App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK (Preview)
        id: setup-dotnet-preview
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup .NET 10 SDK (GA Fallback)
        if: steps.setup-dotnet-preview.outcome == 'failure'
        id: setup-dotnet-ga
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 10 SDK (Install Script Fallback)
        if: steps.setup-dotnet-preview.outcome == 'failure' && steps.setup-dotnet-ga.outcome == 'failure'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Ensure NuGet Package Source
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true

      - name: Run Tests
        run: dotnet test Desktop_App/Upgrahan2/src/GeoSemanticSat.Tests/GeoSemanticSat.Tests.csproj -c Release --nowarn:NU1903,NU1902,NU1904

      - name: Validate Build
        run: dotnet build Desktop_App/Upgrahan2/GeoSemanticSat.slnx -c Release --nowarn:NU1903,NU1902,NU1904

  # The Tauri frontend needs its own gate: the desktop job above is .NET-only, and the
  # release workflow runs after merge, so without this a Rust-only change reached main
  # having never been compiled or type-checked.
  test-and-build-tauri:
    name: Test & Build Tauri Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Desktop_App/UpgrahanRust/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop_App/UpgrahanRust/src-tauri

      # Tauri links against the system webkit/gtk stack on Linux; without these the crate
      # fails to build for reasons that have nothing to do with the change under test.
      - name: Install Tauri System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Frontend Dependencies
        working-directory: Desktop_App/UpgrahanRust
        run: npm ci

      - name: Typecheck Frontend
        working-directory: Desktop_App/UpgrahanRust
        run: npm run typecheck

      - name: Build Frontend
        working-directory: Desktop_App/UpgrahanRust
        run: npm run build

      - name: Run Rust Tests
        working-directory: Desktop_App/UpgrahanRust/src-tauri
        run: cargo test --locked

      - name: Validate Rust Build
        working-directory: Desktop_App/UpgrahanRust/src-tauri
        run: cargo build --locked
