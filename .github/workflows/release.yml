name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Release Title (optional, defaults to "GeoSemanticSat Desktop Release <tag>")'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as Draft Release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK (Preview)
        id: setup-dotnet-preview
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup .NET 10 SDK (GA Fallback)
        if: steps.setup-dotnet-preview.outcome == 'failure'
        id: setup-dotnet-ga
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 10 SDK (Install Script Fallback)
        if: steps.setup-dotnet-preview.outcome == 'failure' && steps.setup-dotnet-ga.outcome == 'failure'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Ensure NuGet Package Source
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true

      - name: Execute Tests
        run: dotnet test Desktop_App/Upgrahan2/src/GeoSemanticSat.Tests/GeoSemanticSat.Tests.csproj -c Release --nowarn:NU1903,NU1902,NU1904

  build:
    name: Build ${{ matrix.platform_name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform_name: Windows x64
          - os: ubuntu-latest
            rid: linux-x64
            platform_name: Linux x64
          - os: macos-latest
            rid: osx-arm64
            platform_name: macOS Apple Silicon (ARM64)
          - os: macos-latest
            rid: osx-x64
            platform_name: macOS Intel (x64)

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK (Preview)
        id: setup-dotnet-preview
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup .NET 10 SDK (GA Fallback)
        if: steps.setup-dotnet-preview.outcome == 'failure'
        id: setup-dotnet-ga
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 10 SDK (Install Script Fallback)
        if: steps.setup-dotnet-preview.outcome == 'failure' && steps.setup-dotnet-ga.outcome == 'failure'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "& ([scriptblock]::Create((Invoke-WebRequest -UseBasicParsing 'https://dot.net/v1/dotnet-install.ps1').Content)) -Channel 10.0"
            echo "$LOCALAPPDATA\Microsoft\dotnet" >> $GITHUB_PATH
          else
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0
            echo "$HOME/.dotnet" >> $GITHUB_PATH
          fi

      - name: Ensure NuGet Package Source
        shell: bash
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true

      - name: Build & Package Windows x64
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/artifacts | Out-Null

          # 1. Full self-contained directory release
          dotnet publish Desktop_App/Upgrahan2/src/GeoSemanticSat.UI/GeoSemanticSat.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/win-x64 `
            --nowarn:NU1903,NU1902,NU1904

          # Release file locks before compressing
          dotnet build-server shutdown
          Start-Sleep -Seconds 1
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/artifacts/GeoSemanticSat-Desktop-win-x64.zip -CompressionLevel Optimal

          # 2. Standalone single-file portable executable
          dotnet publish Desktop_App/Upgrahan2/src/GeoSemanticSat.UI/GeoSemanticSat.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/standalone `
            --nowarn:NU1903,NU1902,NU1904

          dotnet build-server shutdown
          Start-Sleep -Seconds 1
          Copy-Item dist/standalone/GeoSemanticSat.UI.exe -Destination dist/artifacts/GeoSemanticSat-Desktop-win-x64-standalone.exe

      - name: Build & Package Linux x64
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist/artifacts
          dotnet publish Desktop_App/Upgrahan2/src/GeoSemanticSat.UI/GeoSemanticSat.UI.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o dist/linux-x64 \
            --nowarn:NU1903,NU1902,NU1904

          chmod +x dist/linux-x64/GeoSemanticSat.UI
          tar -czvf dist/artifacts/GeoSemanticSat-Desktop-linux-x64.tar.gz -C dist/linux-x64 .

      - name: Build & Package macOS (${{ matrix.rid }})
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          mkdir -p dist/artifacts
          dotnet publish Desktop_App/Upgrahan2/src/GeoSemanticSat.UI/GeoSemanticSat.UI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o dist/${{ matrix.rid }} \
            --nowarn:NU1903,NU1902,NU1904

          chmod +x dist/${{ matrix.rid }}/GeoSemanticSat.UI
          tar -czvf dist/artifacts/GeoSemanticSat-Desktop-${{ matrix.rid }}.tar.gz -C dist/${{ matrix.rid }} .

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: dist/artifacts/*
          if-no-files-found: error

  build-tauri:
    name: Build Rust/Tauri Frontend (${{ matrix.platform_name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            rust_target: x86_64-pc-windows-msvc
            platform_name: Windows x64
          - os: ubuntu-latest
            rid: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            platform_name: Linux x64
          - os: macos-latest
            rid: osx-arm64
            rust_target: aarch64-apple-darwin
            platform_name: macOS Apple Silicon (ARM64)

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Desktop_App/UpgrahanRust/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Desktop_App/UpgrahanRust/src-tauri/Cargo.toml') }}

      # WebKitGTK is the Linux webview Tauri renders into; Windows uses the
      # preinstalled WebView2 and macOS uses WKWebView, so neither needs this.
      - name: Install Linux WebView Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Ensure NuGet Source
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true

      # The Tauri app spawns gss-daemon to reach GeoSemanticSat.Core, so it has to
      # be published self-contained and land next to the app binary.
      - name: Publish Analysis Daemon
        shell: bash
        run: |
          dotnet publish Desktop_App/Upgrahan2/src/GeoSemanticSat.Daemon/GeoSemanticSat.Daemon.csproj             -c Release -r ${{ matrix.rid }} --self-contained true             -o daemon-dist             --nowarn:NU1903,NU1902,NU1904

      - name: Install Frontend Packages
        working-directory: Desktop_App/UpgrahanRust
        run: npm ci --no-audit --no-fund

      - name: Build Tauri Application
        working-directory: Desktop_App/UpgrahanRust
        run: npm run desktop:build -- --target ${{ matrix.rust_target }}

      - name: Package Portable Archive
        shell: bash
        run: |
          mkdir -p dist/artifacts staging
          BIN_DIR="Desktop_App/UpgrahanRust/src-tauri/target/${{ matrix.rust_target }}/release"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$BIN_DIR/upgrahan-rust.exe" staging/UpaGraha.exe
            cp -r daemon-dist/. staging/
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            if cp -R "$BIN_DIR/bundle/macos/UpaGraha.app" staging/ 2>/dev/null; then
              # locate_daemon looks beside current_exe, and inside a .app that is
              # Contents/MacOS - NOT the directory holding the .app. Copying the daemon to
              # the archive root instead would ship a macOS build that cannot start its
              # analysis engine at all.
              cp -r daemon-dist/. "staging/UpaGraha.app/Contents/MacOS/"
            else
              cp "$BIN_DIR/upgrahan-rust" staging/UpaGraha
              chmod +x staging/UpaGraha
              cp -r daemon-dist/. staging/
            fi
          else
            cp "$BIN_DIR/upgrahan-rust" staging/UpaGraha
            chmod +x staging/UpaGraha
            cp -r daemon-dist/. staging/
          fi

          # The daemon is useless if it is not executable after the archive round-trip.
          find staging -name 'gss-daemon' -exec chmod +x {} + 2>/dev/null || true

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "dist/artifacts/GeoSemanticSat-Tauri-${{ matrix.rid }}.zip" ./staging/*
          else
            tar -czvf "dist/artifacts/GeoSemanticSat-Tauri-${{ matrix.rid }}.tar.gz" -C staging .
          fi

      - name: Upload Tauri Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tauri-${{ matrix.rid }}
          path: dist/artifacts/*
          if-no-files-found: error

  build-universal:
    name: Build Universal Bundle (${{ matrix.platform_name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            rust_target: x86_64-pc-windows-msvc
            platform_name: Windows x64
          - os: ubuntu-latest
            rid: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            platform_name: Linux x64
          - os: macos-latest
            rid: osx-arm64
            rust_target: aarch64-apple-darwin
            platform_name: macOS Apple Silicon (ARM64)

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Desktop_App/UpgrahanRust/src-tauri/target
          key: ${{ runner.os }}-cargo-universal-${{ hashFiles('Desktop_App/UpgrahanRust/src-tauri/Cargo.toml') }}

      - name: Install Linux WebView Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Ensure NuGet Source
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true

      # Both frontends and the analysis daemon land in ONE directory. That co-location is
      # what makes the switch work at all: each build looks for its sibling next to its own
      # executable, and refuses to offer the control when it is not there.
      - name: Publish Avalonia Frontend
        shell: bash
        run: |
          dotnet publish Desktop_App/Upgrahan2/src/GeoSemanticSat.UI/GeoSemanticSat.UI.csproj             -c Release -r ${{ matrix.rid }} --self-contained true             -o universal             --nowarn:NU1903,NU1902,NU1904

      - name: Publish Analysis Daemon
        shell: bash
        run: |
          dotnet publish Desktop_App/Upgrahan2/src/GeoSemanticSat.Daemon/GeoSemanticSat.Daemon.csproj             -c Release -r ${{ matrix.rid }} --self-contained true             -o universal             --nowarn:NU1903,NU1902,NU1904

      - name: Install Frontend Packages
        working-directory: Desktop_App/UpgrahanRust
        run: npm ci --no-audit --no-fund

      - name: Build Tauri Frontend
        working-directory: Desktop_App/UpgrahanRust
        run: npm run desktop:build -- --target ${{ matrix.rust_target }}

      - name: Assemble Universal Bundle
        shell: bash
        run: |
          BIN_DIR="Desktop_App/UpgrahanRust/src-tauri/target/${{ matrix.rust_target }}/release"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$BIN_DIR/upgrahan-rust.exe" universal/upgrahan-rust.exe
          else
            cp "$BIN_DIR/upgrahan-rust" universal/upgrahan-rust
            chmod +x universal/upgrahan-rust "universal/GeoSemanticSat.UI"
          fi

          # Neither build is "the" entry point - the user picks one and can switch from
          # inside it. A README beats guessing which executable to double-click.
          cat > universal/README.txt <<'TXT'
          UpaGraha - universal bundle

          Two frontends over the same analysis engine. Start either one:

            GeoSemanticSat.UI    the Avalonia build
            upgrahan-rust        the experimental Rust/Tauri build

          Each has a control in its header to close itself and reopen the other. That
          control only appears when both are present, which is why it is offered here and
          not in the single-frontend downloads.

          gss-daemon is the shared analysis engine. Both frontends start it themselves;
          you do not run it directly.
          TXT

          mkdir -p dist/artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "dist/artifacts/GeoSemanticSat-Universal-${{ matrix.rid }}.zip" ./universal/*
          else
            tar -czvf "dist/artifacts/GeoSemanticSat-Universal-${{ matrix.rid }}.tar.gz" -C universal .
          fi

      # Prove the switch can actually work in what we just built, rather than finding out
      # from a user that the control is missing. Both executables and the daemon must be
      # present and co-located, or the control hides itself and the bundle is pointless.
      - name: Verify The Bundle Can Switch
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            AVALONIA=universal/GeoSemanticSat.UI.exe; TAURI=universal/upgrahan-rust.exe; DAEMON=universal/gss-daemon.exe
          else
            AVALONIA=universal/GeoSemanticSat.UI;     TAURI=universal/upgrahan-rust;     DAEMON=universal/gss-daemon
          fi

          missing=0
          for f in "$AVALONIA" "$TAURI" "$DAEMON"; do
            if [ ! -f "$f" ]; then echo "MISSING from the universal bundle: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "The universal bundle cannot switch frontends."; exit 1; }
          echo "Both frontends and the daemon are co-located; the switch control will appear."

      - name: Upload Universal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-universal-${{ matrix.rid }}
          path: dist/artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build, build-tauri, build-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums & Release Notes
        shell: bash
        run: |
          cd release-assets
          sha256sum GeoSemanticSat-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="GeoSemanticSat Desktop Release $TAG"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE="GeoSemanticSat Desktop Release $TAG"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_ENV

          cat << 'EOF' > RELEASE_NOTES.md
          # GeoSemanticSat — Sovereign Earth Observation Intelligence Studio

          Official standalone desktop application releases for **GeoSemanticSat** (UpaGraha).
          All binaries are self-contained and pre-packaged with the .NET runtime and native acceleration libraries (ONNX Runtime, SkiaSharp). No external runtime installation is required.

          ---

          ### Available Downloads

          | Platform | Package | Description |
          |:---|:---|:---|
          | **Windows x64** | `GeoSemanticSat-Desktop-win-x64.zip` | Full portable directory bundle. Extract and launch `GeoSemanticSat.UI.exe`. |
          | **Windows x64** | `GeoSemanticSat-Desktop-win-x64-standalone.exe` | Single standalone portable executable. Ready to run immediately. |
          | **Linux x64** | `GeoSemanticSat-Desktop-linux-x64.tar.gz` | Self-contained Linux build (X11 / Wayland with automatic headless CLI fallback). |
          | **macOS Apple Silicon** | `GeoSemanticSat-Desktop-osx-arm64.tar.gz` | Native Apple Silicon (M1/M2/M3/M4) self-contained archive. |
          | **macOS Intel** | `GeoSemanticSat-Desktop-osx-x64.tar.gz` | Native Intel x64 self-contained archive. |
          | **Verification** | `SHA256SUMS.txt` | SHA-256 cryptographic hashes for integrity verification. |

          #### Which package?

          There are two frontends over the same analysis engine, and three ways to get them.
          The numbers they produce are identical - both call the same compiled core - so the
          choice is about the interface, not the results.

          | Package | Contains | Pick this if |
          |:---|:---|:---|
          | `GeoSemanticSat-Desktop-*` | Avalonia frontend | You want the established build. |
          | `GeoSemanticSat-Tauri-*` | Rust/Tauri frontend | You want the experimental build on its own. |
          | `GeoSemanticSat-Universal-*` | **Both**, side by side | You want to compare them, or switch without reinstalling. |

          Only the universal bundle can switch. Each frontend looks for its sibling next to
          its own executable, so in the single-frontend downloads the control is absent
          rather than present-and-broken.

          | Universal | Package |
          |:---|:---|
          | **Windows x64** | `GeoSemanticSat-Universal-win-x64.zip` |
          | **Linux x64** | `GeoSemanticSat-Universal-linux-x64.tar.gz` |
          | **macOS Apple Silicon** | `GeoSemanticSat-Universal-osx-arm64.tar.gz` |

          In the universal bundle, start either `GeoSemanticSat.UI` or `upgrahan-rust`.
          Each has a control in its header that closes itself and reopens the other; the
          Tauri side shows a five-second countdown you can cancel. The frontend you switch
          to **starts fresh** - only your choice of frontend is remembered, not the loaded
          archive or recorded verdicts, so export anything you need to keep first.

          ---

          ### Quick Start

          #### Windows
          - Option A: Download `GeoSemanticSat-Desktop-win-x64.zip`, extract to any folder, and double-click `GeoSemanticSat.UI.exe`.
          - Option B: Download `GeoSemanticSat-Desktop-win-x64-standalone.exe` and run directly.

          #### Linux
          ```bash
          tar -xzvf GeoSemanticSat-Desktop-linux-x64.tar.gz -C ./geosemanticsat
          cd ./geosemanticsat
          ./GeoSemanticSat.UI
          ```
          *(Note: When executed in an environment without X11/Wayland, the application automatically runs in CLI mode)*

          #### macOS
          ```bash
          tar -xzvf GeoSemanticSat-Desktop-osx-arm64.tar.gz -C ./geosemanticsat # (or osx-x64 for Intel)
          cd ./geosemanticsat
          xattr -d com.apple.quarantine GeoSemanticSat.UI 2>/dev/null || true
          ./GeoSemanticSat.UI
          ```

          ---

          ### Integrity Verification (SHA-256)
          Verify downloads using the bundled `SHA256SUMS.txt`:
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-assets/GeoSemanticSat-Desktop-win-x64.zip
            release-assets/GeoSemanticSat-Desktop-win-x64-standalone.exe
            release-assets/GeoSemanticSat-Desktop-linux-x64.tar.gz
            release-assets/GeoSemanticSat-Desktop-osx-arm64.tar.gz
            release-assets/GeoSemanticSat-Desktop-osx-x64.tar.gz
            release-assets/GeoSemanticSat-Tauri-win-x64.zip
            release-assets/GeoSemanticSat-Tauri-linux-x64.tar.gz
            release-assets/GeoSemanticSat-Tauri-osx-arm64.tar.gz
            release-assets/GeoSemanticSat-Universal-win-x64.zip
            release-assets/GeoSemanticSat-Universal-linux-x64.tar.gz
            release-assets/GeoSemanticSat-Universal-osx-arm64.tar.gz
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
